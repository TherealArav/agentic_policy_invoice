services:
  backend:
    build: 
      context: ./backend
    ports:
      - "8000:8000"
    # Pulls your LangSmith and Gemini keys directly into the container
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/.venv
  frontend:
    build: 
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend