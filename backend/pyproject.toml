[project]
name = "agentic-policy-invoice"
version = "0.1.0"
description = "Multimodal Invoice Agent Backend"
readme = "README.md"
authors = [
    { name = "TherealArav", email = "aravzgoyal@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docling>=2.137.0",
    "fastapi>=0.143.0",
    "google-genai>=2.29.0",
    "langgraph>=1.2.14",
    "logfire>=5.1.1",
    "pydantic>=2.14.0",
    "pydantic-ai>=2.55.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.1",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
